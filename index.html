<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Trails Durga Puja 2026 - Sponsorship</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff8ef;color:#33251d}
.hero{background:linear-gradient(135deg,#8b0000,#c2410c);color:#fff;padding:28px 18px;text-align:center}
.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:5px 0}
.wrap{max-width:1200px;margin:auto;padding:18px}
.actions,.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-block;padding:11px 16px;border-radius:8px;text-decoration:none;font-weight:700;border:1px solid #b45309;background:#fff;color:#8b0000}
.btn.primary{background:#8b0000;color:#fff}
.status{padding:12px 15px;border-radius:8px;background:#fff3cd;margin-bottom:16px;font-weight:600}
.error{background:#fee2e2;color:#991b1b}
input{flex:1;min-width:240px;padding:12px;border:1px solid #d6c3b5;border-radius:8px;font-size:15px}
select{padding:12px;border:1px solid #d6c3b5;border-radius:8px;background:#fff}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px #0001;border:1px solid #eaded5}
.label{font-size:13px;color:#76645a}.value{font-size:23px;font-weight:700;margin-top:5px}
.section{margin:22px 0;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #0001;border:1px solid #eaded5}
.section-title{background:#f59e0b;color:#3b2208;padding:13px 15px;font-size:18px;font-weight:700}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px 10px;border-bottom:1px solid #eee7e1;text-align:left;vertical-align:top}
th{background:#fff7ed;color:#6b3d16;font-size:13px}tr:last-child td{border-bottom:0}
.special{background:#ecfdf5}.open{color:#166534;font-weight:700}.closed{color:#991b1b;font-weight:700}
.muted{color:#8a7b72}.empty{padding:30px;text-align:center;color:#76645a}
footer{text-align:center;padding:25px;color:#76645a;font-size:13px}
@media(max-width:650px){.hero h1{font-size:25px}.wrap{padding:10px}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="hero">
<h1>🙏 Happy Trails Durga Puja 2026 🙏</h1>
<p>Residents' Special Offerings & Sponsorship</p>
<p>Multiple sponsors are welcome</p>
</header>

<main class="wrap">
<div class="actions">
<a class="btn primary" href="https://forms.gle/p815HuL5vY99qGqJ7" target="_blank">➕ Submit Sponsorship</a>
<a class="btn" href="https://docs.google.com/spreadsheets/d/1GhlUidXHs0y4GE4SoqGvfVZ2WNmksVdDDF4Gm1XWkj4/edit?usp=drivesdk" target="_blank">📊 Open Sheet</a>
</div>

<div id="status" class="status">Connecting to Google Sheet…</div>

<div class="controls">
<input id="search" type="search" placeholder="Search sponsorship, section or resident…">
<select id="statusFilter">
<option value="all">All status</option><option value="Open">Open</option><option value="Closed">Closed</option>
</select>
</div>

<div class="summary">
<div class="card"><div class="label">Sponsorship items</div><div class="value" id="itemCount">0</div></div>
<div class="card"><div class="label">Open items</div><div class="value" id="openCount">0</div></div>
<div class="card"><div class="label">Received</div><div class="value" id="receivedTotal">₹0</div></div>
<div class="card"><div class="label">Budget</div><div class="value" id="budgetTotal">₹0</div></div>
</div>

<div id="content"></div>
</main>
<footer>Happy Trails Durga Puja 2026 • Live sponsorship information</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwFun-7WaHfqhheWtB2UXv4IQEGXYefHphHd-uL5MOByeznxSpZJLBtzbLnp15xwC_KYw/exec";
let rows=[];

function money(v){
 if(v===null||v===undefined||v==="") return "—";
 const n=Number(String(v).replace(/[₹,\s]/g,""));
 return Number.isFinite(n) ? "₹"+n.toLocaleString("en-IN") : String(v);
}
function num(v){
 if(v===null||v===undefined||v==="") return 0;
 const n=Number(String(v).replace(/[₹,\s,]/g,""));
 return Number.isFinite(n)?n:0;
}
function hidePhone(v){
 return String(v ?? "");
}
function esc(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function sectionRow(r){return r&&r[1]&&!r[0]&&!r[2]}
function itemRow(r){return r&&r[1]&&!sectionRow(r)&&String(r[1]).toLowerCase()!=="total"}

function formatDate(v){
 if(v===null||v===undefined||v==="") return "—";
 if(v instanceof Date && !isNaN(v)) return v.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
 const s=String(v).trim();
 const d=new Date(s);
 if(!isNaN(d.getTime()) && /[-/]/.test(s)) return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
 return s;
}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const filter=document.getElementById("statusFilter").value;
 const groups=[]; let current=null;
 rows.forEach(r=>{
   if(sectionRow(r)){current={title:String(r[1]),items:[]};groups.push(current)}
   else if(itemRow(r)){if(!current){current={title:"Sponsorship",items:[]};groups.push(current)}current.items.push(r)}
 });
 let itemCount=0,openCount=0,received=0,budget=0;
 const html=groups.map(g=>{
   const items=g.items.filter(r=>{
     const status=String(r[3]||"").trim();
     const text=[r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]].join(" ").toLowerCase();
     return (!q||text.includes(q))&&(filter==="all"||status===filter);
   });
   if(!items.length)return "";
   itemCount+=items.length;
   items.forEach(r=>{if(String(r[3]).trim().toLowerCase()==="open")openCount++;received+=num(r[4]);budget+=num(r[5])});
   return `<section class="section"><div class="section-title">${esc(g.title)}</div>
   <div class="table-wrap"><table><thead><tr>
   <th>#</th><th>Sponsorship</th><th>Minimum Contribution</th><th>Status</th><th>Received</th><th>Budget</th><th>Resident Details</th><th>Transaction Date</th>
   </tr></thead><tbody>${
     items.map(r=>{
       const status=String(r[3]||"").trim();
       const cls=status.toLowerCase()==="open"?"open":status.toLowerCase()==="closed"?"closed":"muted";
       const special=!r[2];
       return `<tr class="${special?'special':''}">
       <td>${esc(r[0]||"")}</td><td><strong>${esc(r[1])}</strong></td>
       <td>${r[2]?money(r[2]):"Multiple / As applicable"}</td>
       <td class="${cls}">${esc(status||"—")}</td>
       <td>${r[4]!==""?money(r[4]):"—"}</td>
       <td>${r[5]!==""?money(r[5]):"—"}</td>
       <td>${esc(hidePhone(r[6]||"")).replace(/\n/g,"<br>")||"—"}</td>
       <td>${formatDate(r[7])}</td>
       </tr>`;
     }).join("")
   }</tbody></table></div></section>`;
 }).join("");
 document.getElementById("itemCount").textContent=itemCount;
 document.getElementById("openCount").textContent=openCount;
 document.getElementById("receivedTotal").textContent=money(received);
 document.getElementById("budgetTotal").textContent=money(budget);
 document.getElementById("content").innerHTML=html||'<div class="card empty">No sponsorship items match your search/filter.</div>';
}

function setStatus(message,error=false){
 const el=document.getElementById("status");
 el.textContent=message;el.className="status"+(error?" error":"");
}

/* JSONP is used so the GitHub Pages site can read the Apps Script
   response without a CORS restriction. */
function loadWithJSONP(){
 return new Promise((resolve,reject)=>{
   const callback="handleSheetData_"+Date.now();
   const script=document.createElement("script");
   let finished=false;
   window[callback]=data=>{
     finished=true;
     delete window[callback];
     script.remove();
     if(data&&data.success&&Array.isArray(data.data)) resolve(data.data);
     else reject(new Error("Invalid response from Google Sheet"));
   };
   script.onerror=()=>{
     if(finished)return;
     delete window[callback];script.remove();
     reject(new Error("Google Apps Script did not return JSONP. Please redeploy Code.gs with the callback version."));
   };
   script.src=API_URL+"?callback="+encodeURIComponent(callback);
   document.body.appendChild(script);
 });
}

async function loadData(){
 setStatus("Connecting to Google Sheet…");
 try{
   rows=await loadWithJSONP();
   setStatus("✓ Live sponsorship data loaded from Google Sheet");
   render();
 }catch(err){
   console.error(err);
   setStatus("Unable to load live sponsorship data. Please check the Apps Script deployment and JSONP code.",true);
   document.getElementById("content").innerHTML=
     '<div class="card"><strong>Connection issue</strong><p>The Google Sheet endpoint is reachable, but the webpage did not receive the expected JSONP response.</p><p>Make sure the Apps Script <code>doGet(e)</code> returns <code>callback(data)</code> when a callback parameter is supplied.</p></div>';
 }
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("statusFilter").addEventListener("change",render);
loadData();
</script>
</body>
</html>
